  <text x="600" y="385" text-anchor="middle" fill="#E6E1D6" font-family="Georgia, serif" font-size="26" font-style="italic">“˹Moses˺ prayed, “My Lord! Uplift my heart for me, and make my task easy for me, and remove the impediment from my tongue, so people may understand my speech.””</text>
